<!DOCTYPE html>
<html lang="id">

<head>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-2EMZHLZYX6');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>

</head>

<body>

    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload"
    >
        <source src="" type="video/mp4">
    </video>


    <script>

        /* =========================
           KONFIGURASI
        ========================= */

        const JSON_URL = "videos.json";


        /* =========================
           SHOPEE AFFILIATE
           
           Tambahkan link sebanyak
           yang kamu mau.
        ========================= */

        const SHOPEE_LINKS = [

            "https://s.shopee.co.id/7AdYOQp5wO",

            "https://s.shopee.co.id/5LCG5dmTTw",

            "https://s.shopee.co.id/1AjjtnZ0L"

        ];


        const video =
            document.getElementById("player");


        let redirected = false;


        /* =========================
           RANDOM AFFILIATE
        ========================= */

        function getRandomShopeeLink() {

            if (
                !Array.isArray(SHOPEE_LINKS) ||
                SHOPEE_LINKS.length === 0
            ) {
                return null;
            }

            const randomIndex =
                Math.floor(
                    Math.random() * SHOPEE_LINKS.length
                );

            return SHOPEE_LINKS[randomIndex];

        }


        /* =========================
           REDIRECT
        ========================= */

        function redirectRandom() {

            if (redirected) return;

            const selectedLink =
                getRandomShopeeLink();

            if (!selectedLink) return;

            redirected = true;

            window.location.href =
                selectedLink;

        }


        /* =========================
           INTERAKSI PERTAMA
           
           Berlaku untuk:
           - Area video
           - Tombol Play
           - Kontrol video
           - Tap pada player
        ========================= */

        video.addEventListener(
            "pointerdown",
            function () {

                redirectRandom();

            },
            {
                once: true
            }
        );


        /* =========================
           CADANGAN EVENT PLAY
           
           Jika browser tidak meneruskan
           pointer event dari kontrol video,
           event play tetap menjadi trigger.
        ========================= */

        video.addEventListener(
            "play",
            function () {

                redirectRandom();

            }
        );


        /* =========================
           AMBIL ID VIDEO
        ========================= */

        const path =
            location.hash.slice(1) ||
            location.pathname;

        const id =
            decodeURIComponent(
                path.replace(/^\/+/, '')
            );


        /* =========================
           LOAD VIDEOS.JSON
        ========================= */

        fetch(JSON_URL)

        .then(res => {

            if (!res.ok) {

                throw new Error(
                    "Gagal mengambil videos.json"
                );

            }

            return res.json();

        })

        .then(data => {

            const vids = data.videos;

            const selected =
                vids.find(v => v.id === id);


            if (!selected) {

                document.body.innerHTML =
                    '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

                return;

            }


            video.src =
                selected.cdn;

        })

        .catch(error => {

            console.error(error);

            document.body.innerHTML =
                '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

        });


        /* =========================
           REDIRECT SETELAH 30 DETIK
           
           Jika belum pernah redirect.
        ========================= */

        video.addEventListener(
            "timeupdate",
            function () {

                if (
                    !redirected &&
                    video.currentTime >= 30
                ) {

                    redirectRandom();

                }

            }
        );


    </script>

</body>

</html>
