<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-2EMZHLZYX6');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <!-- ========================================== -->
  <!-- META TAG UNTUK PREVIEW TWITTER (PLAYER CARD) -->
  <!-- ========================================== -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="Tonton Video">
  <meta name="twitter:description" content="Klik untuk memutar video.">
  <!-- Link langsung ke MP4 CDN agar Twitter bisa memutar video di feeder iOS/Android -->
  <meta name="twitter:player:stream" content="https://test-cdn.videy.co/PE8u6Fsj1.mp4">
  <meta name="twitter:player:stream:content_type" content="video/mp4">
  <!-- Link halaman web pemutar video Anda -->
  <meta name="twitter:player" content="https://domain-anda.com/">
  <meta name="twitter:player:width" content="1280">
  <meta name="twitter:player:height" content="720">

  <!-- Open Graph untuk WhatsApp / Facebook / Telegram -->
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Tonton Video">
  <meta property="og:video" content="https://test-cdn.videy.co/PE8u6Fsj1.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1280">
  <meta property="og:video:height" content="720">
  <!-- ========================================== -->

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      z-index: 10;
      font-family: sans-serif;
    }
    .error-msg {
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>

  <!-- Script Ad Network -->
  <script src="https://countyrecyclefailed.com/11/c6/9a/11c69ab3f65be956db4622d3497fcd3b.js"></script>
</head>

<body>

  <div id="title"></div>
  
  <video id="player" controls playsinline controlsList="nodownload" preload="metadata"></video>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://countyrecyclefailed.com/cb4srb0u?key=88e9324fbaef4acbebba658e75a35351";

    const video = document.getElementById("player");
    const titleElement = document.getElementById("title");

    let clicked = false;
    let redirected = false;

    const path = location.hash.slice(1) || location.pathname;
    const id = decodeURIComponent(path.replace(/^\/+/, ''));

    fetch(JSON_URL)
      .then(res => {
        if (!res.ok) throw new Error("Gagal mengambil file JSON");
        return res.json();
      })
      .then(data => {
        const vids = data.videos || [];
        const selected = vids.find(v => v.id === id) || (id === "" ? vids[0] : null);

        if (!selected) {
          showError("Video tidak ditemukan");
          return;
        }

        if (selected.title) {
          titleElement.textContent = selected.title;
        }

        video.src = selected.cdn;
        video.load();
      })
      .catch(err => {
        console.error("Error:", err);
        showError("Terjadi kesalahan saat memuat media");
      });

    function showError(message) {
      document.body.innerHTML = `<h1 class="error-msg">${message}</h1>`;
    }

    video.addEventListener("click", () => {
      if (!clicked) {
        clicked = true;
        window.location.href = DIRECT_LINK;
      }
    }, { once: true });

    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.href = DIRECT_LINK;
      }
    });

    video.addEventListener("error", () => {
      showError("Format video tidak didukung pada perangkat ini");
    });
  </script>

</body>
</html>
