<!DOCTYPE html>
<html lang="id">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2EMZHLZYX6');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Universal Video Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script src="https://countyrecyclefailed.com/11/c6/9a/11c69ab3f65be956db4622d3497fcd3b.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    #title {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-size: 14px;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .error-screen {
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .error-screen h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <div id="title"></div>
    <video id="player" controls playsinline webkit-playsinline controlsList="nodownload" preload="auto"></video>
  </div>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://countyrecyclefailed.com/cb4srb0u?key=88e9324fbaef4acbebba658e75a35351";

    const video = document.getElementById("player");
    const titleElement = document.getElementById("title");

    let clicked = false;
    let redirected = false;

    // Normalisasi ID URL dari hash (#) atau pathname
    function getCleanId() {
      let path = location.hash ? location.hash.slice(1) : location.pathname;
      return decodeURIComponent(path)
        .replace(/^\/+|\/+$/g, '')
        .replace(/\.mp4$/i, '');
    }

    const currentId = getCleanId();

    // Fungsi pemuat video lintas perangkat
    function loadVideoSource(videoUrl) {
      // 1. Pemutaran HLS jika format file .m3u8 (Sangat Direkomendasikan)
      if (videoUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(videoUrl);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = videoUrl;
        }
      } else {
        // 2. Pemutaran MP4 standar dengan paksaan buffering untuk Safari & Chromium
        video.src = videoUrl;
        video.load();
      }
    }

    // Ambil Data dari JSON
    fetch(JSON_URL)
      .then(res => {
        if (!res.ok) throw new Error("Gagal memuat JSON");
        return res.json();
      })
      .then(data => {
        const vids = data.videos || [];
        
        // Pencarian ID dengan penanganan komprehensif
        const selected = vids.find(v => {
          if (!v.id) return false;
          const cleanVId = v.id.replace(/^\/+|\/+$/g, '').replace(/\.mp4$/i, '');
          return cleanVId === currentId || v.id === currentId;
        }) || (currentId === "" ? vids[0] : null);

        if (!selected) {
          showError("Video tidak ditemukan");
          return;
        }

        if (selected.title) {
          titleElement.textContent = selected.title;
        }

        loadVideoSource(selected.cdn);
      })
      .catch(err => {
        console.error(err);
        showError("Gagal memuat sistem pemutar video");
      });

    function showError(msg) {
      document.getElementById("player-container").innerHTML = `
        <div class="error-screen">
          <h1>${msg}</h1>
        </div>
      `;
    }

    // Handler Redirect Klik Pertama
    video.addEventListener("click", () => {
      if (!clicked) {
        clicked = true;
        window.location.href = DIRECT_LINK;
      }
    }, { once: true });

    // Handler Redirect Detik ke-30
    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.href = DIRECT_LINK;
      }
    });

    // Fallback otomatis jika peramban memblokir format tertentu
    video.addEventListener("error", () => {
      // Menghapus restriksi browser dan mencoba memuat ulang secara paksa
      if (video.src) {
        video.play().catch(() => {});
      }
    });
  </script>

</body>
</html>
