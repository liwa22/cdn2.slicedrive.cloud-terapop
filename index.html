<!DOCTYPE html>
<html lang="id">

<head>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-2EMZHLZYX6');
    </script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #000;

            overflow: hidden;

        }


        video {

            width: 100%;

            height: 100vh;

            object-fit: contain;

            background: #000;

        }


        /* =========================
           TOAST / POPUP IKLAN
        ========================= */

        #adOverlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.65);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 99999;

        }


        #adBox {

            width: calc(100% - 40px);

            max-width: 560px;

            background: #fff;

            border-radius: 18px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 10px 40px rgba(0,0,0,.4);

        }


        #adBox h2 {

            margin: 0 0 25px;

            font-size: 30px;

            color: #111;

        }


        #adBox p {

            margin: 0;

            font-size: 21px;

            line-height: 1.4;

            color: #222;

        }


        /*
         * Tombol visual saja.
         *
         * Klik sebenarnya ditangani
         * oleh seluruh overlay.
         */

        #downloadButton {

            display: block;

            width: 100%;

            max-width: 375px;

            margin: 28px auto 0;

            padding: 18px 20px;

            border: none;

            border-radius: 12px;

            background: #2196f3;

            color: #fff;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

        }

    </style>

</head>


<body>


    <!-- =========================
         VIDEO
    ========================= -->

    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload"
    >

        <source
            src=""
            type="video/mp4"
        >

    </video>



    <!-- =========================
         TOAST IKLAN
    ========================= -->

    <div id="adOverlay">

        <div id="adBox">

            <h2>
                Download Video
            </h2>

            <p>
                Klik download untuk melihat versi lengkap
            </p>

            <button id="downloadButton">
                DOWNLOAD SEKARANG
            </button>

        </div>

    </div>



    <script>


        /* =====================================================
           KONFIGURASI
        ===================================================== */

        const JSON_URL = "videos.json";


        /* =====================================================
           SHOPEE AFFILIATE
        ===================================================== */

        const SHOPEE_LINKS = [

            "https://s.shopee.co.id/7AdYOQp5wO",

            "https://s.shopee.co.id/5LCG5dmTTw",

            "https://s.shopee.co.id/1AjjtnZ0L"

        ];


        /* =====================================================
           ELEMENT
        ===================================================== */

        const video =
            document.getElementById("player");


        const adOverlay =
            document.getElementById("adOverlay");


        const downloadButton =
            document.getElementById("downloadButton");


        /* =====================================================
           STATUS
        ===================================================== */

        let initialAdShown = false;

        let redirecting = false;

        let currentVideoId = "";

        let adTimer = null;


        /* =====================================================
           RANDOM SHOPEE
        ===================================================== */

        function getRandomShopeeLink() {

            if (
                !Array.isArray(SHOPEE_LINKS) ||
                SHOPEE_LINKS.length === 0
            ) {

                return null;

            }


            const randomIndex =
                Math.floor(
                    Math.random() *
                    SHOPEE_LINKS.length
                );


            return SHOPEE_LINKS[randomIndex];

        }


        /* =====================================================
           KEY IKLAN PER VIDEO
           
           Contoh:

           video_ad_seen_video1.mp4
           video_ad_seen_video2.mp4
           video_ad_seen_video3.mp4
        ===================================================== */

        function getAdStorageKey(videoId) {

            return (
                "video_ad_seen_" +
                videoId
            );

        }


        /* =====================================================
           CEK APAKAH IKLAN AWAL SUDAH DIKLIK
        ===================================================== */

        function hasSeenInitialAd(videoId) {

            if (!videoId) {
                return false;
            }


            return sessionStorage.getItem(
                getAdStorageKey(videoId)
            ) === "1";

        }


        /* =====================================================
           TANDAI IKLAN AWAL SUDAH SELESAI
        ===================================================== */

        function markInitialAdSeen() {

            if (!currentVideoId) {
                return;
            }


            sessionStorage.setItem(

                getAdStorageKey(
                    currentVideoId
                ),

                "1"

            );

        }


        /* =====================================================
           TAMPILKAN TOAST AWAL
        ===================================================== */

        function showInitialAd() {

            if (initialAdShown) {
                return;
            }


            if (
                hasSeenInitialAd(
                    currentVideoId
                )
            ) {

                return;

            }


            initialAdShown = true;


            adOverlay.style.display =
                "flex";

        }


        /* =====================================================
           SEMBUNYIKAN TOAST
        ===================================================== */

        function hideInitialAd() {

            adOverlay.style.display =
                "none";

        }


        /* =====================================================
           REDIRECT AFFILIATE
        ===================================================== */

        function redirectAffiliate() {

            if (redirecting) {
                return;
            }


            const selectedLink =
                getRandomShopeeLink();


            if (!selectedLink) {
                return;
            }


            redirecting = true;


            window.location.href =
                selectedLink;

        }


        /* =====================================================
           KLIK SAAT TOAST TAMPIL
           
           APAPUN YANG DIKLIK:
           
           - kotak putih
           - tulisan
           - tombol
           - area hitam
           - video
           - kontrol
           
           semuanya redirect affiliate.
        ===================================================== */

        document.addEventListener(

            "click",

            function (event) {

                /*
                 * Kalau toast sedang tampil,
                 * klik DI MANA SAJA = affiliate.
                 */

                if (
                    adOverlay.style.display ===
                    "flex"
                ) {

                    /*
                     * Tandai khusus video ini
                     * sebelum redirect.
                     */

                    markInitialAdSeen();


                    /*
                     * Sembunyikan toast.
                     */

                    hideInitialAd();


                    /*
                     * Redirect Shopee.
                     */

                    redirectAffiliate();

                    return;

                }

            },

            true

        );


        /* =====================================================
           SUPPORT TOUCH HP
           
           Pada HP, touch bisa terjadi sebelum click.
        ===================================================== */

        document.addEventListener(

            "touchstart",

            function () {

                if (
                    adOverlay.style.display ===
                    "flex"
                ) {

                    markInitialAdSeen();

                    hideInitialAd();

                    redirectAffiliate();

                }

            },

            {
                capture: true,
                passive: true
            }

        );


        /* =====================================================
           IKLAN 40 DETIK
           
           Setelah video berjalan 40 detik,
           redirect affiliate.

           Setelah user kembali dari Shopee,
           timer dimulai lagi dari awal.
        ===================================================== */

        function start40SecondAdTimer() {

            clearTimeout(adTimer);


            adTimer = setTimeout(

                function () {

                    redirectAffiliate();

                },

                40000

            );

        }


        /* =====================================================
           RESET TIMER
        ===================================================== */

        function reset40SecondAdTimer() {

            clearTimeout(adTimer);

            start40SecondAdTimer();

        }


        /* =====================================================
           VIDEO MULAI
        ===================================================== */

        video.addEventListener(

            "play",

            function () {

                /*
                 * Timer 40 detik mulai
                 * ketika video dimainkan.
                 */

                start40SecondAdTimer();

            }

        );


        /* =====================================================
           VIDEO PAUSE
        ===================================================== */

        video.addEventListener(

            "pause",

            function () {

                clearTimeout(adTimer);

            }

        );


        /* =====================================================
           VIDEO SELESAI
        ===================================================== */

        video.addEventListener(

            "ended",

            function () {

                clearTimeout(adTimer);

            }

        );


        /* =====================================================
           AMBIL ID VIDEO
        ===================================================== */

        const path =
            location.hash.slice(1) ||
            location.pathname;


        currentVideoId =
            decodeURIComponent(
                path.replace(/^\/+/, '')
            );


        /* =====================================================
           LOAD VIDEOS.JSON
        ===================================================== */

        fetch(JSON_URL)

        .then(

            res => {

                if (!res.ok) {

                    throw new Error(
                        "Gagal mengambil videos.json"
                    );

                }


                return res.json();

            }

        )

        .then(

            data => {

                const vids =
                    data.videos;


                const selected =
                    vids.find(

                        v =>
                            v.id ===
                            currentVideoId

                    );


                if (!selected) {

                    document.body.innerHTML =

                        `
                        <h1 style="
                            color:white;
                            text-align:center;
                            margin-top:40px;
                        ">
                            Video tidak ditemukan
                        </h1>
                        `;

                    return;

                }


                video.src =
                    selected.cdn;


                /*
                 * Setelah video siap,
                 * cek apakah video ID ini
                 * sudah pernah mendapat iklan awal.
                 */

                if (
                    !hasSeenInitialAd(
                        currentVideoId
                    )
                ) {

                    /*
                     * Toast tidak langsung
                     * muncul sebelum interaksi.
                     *
                     * Begitu user menyentuh /
                     * mengklik halaman,
                     * toast muncul.
                     */

                }

            }

        )

        .catch(

            error => {

                console.error(error);


                document.body.innerHTML =

                    `
                    <h1 style="
                        color:white;
                        text-align:center;
                        margin-top:40px;
                    ">
                        Gagal memuat video
                    </h1>
                    `;

            }

        );


        /* =====================================================
           INTERAKSI PERTAMA
           
           Kalau ID video belum pernah mendapatkan
           iklan awal, tampilkan toast.
        ===================================================== */

        document.addEventListener(

            "pointerdown",

            function () {

                if (
                    !hasSeenInitialAd(
                        currentVideoId
                    )
                ) {

                    showInitialAd();

                }

            },

            {
                capture: true,
                once: true
            }

        );


    </script>


</body>

</html>
