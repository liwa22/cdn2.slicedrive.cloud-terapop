<!DOCTYPE html>
<html lang="id">

<head>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-2EMZHLZYX6');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload"
    >
        <source src="" type="video/mp4">
    </video>


    <script>

        /* =========================
           KONFIGURASI
        ========================= */

        const JSON_URL = "videos.json";


        /* =========================
           SHOPEE AFFILIATE
           
           Tambahkan link sebanyak
           yang kamu inginkan.
        ========================= */

        const SHOPEE_LINKS = [

            "https://s.shopee.co.id/7AdYOQp5wO",

            "https://s.shopee.co.id/5LCG5dmTTw",

            "https://s.shopee.co.id/1AjjtnZ0L"

        ];


        const video = document.getElementById("player");


        let clicked = false;
        let redirected = false;


        /* =========================
           PILIH SHOPEE RANDOM
        ========================= */

        function getRandomShopeeLink() {

            const randomIndex =
                Math.floor(
                    Math.random() * SHOPEE_LINKS.length
                );

            return SHOPEE_LINKS[randomIndex];

        }


        /* =========================
           REDIRECT KE SHOPEE
        ========================= */

        function redirectRandom() {

            if (redirected) return;

            redirected = true;

            const selectedLink =
                getRandomShopeeLink();

            window.location.href = selectedLink;

        }


        /* =========================
           AMBIL ID VIDEO
        ========================= */

        const path =
            location.hash.slice(1) ||
            location.pathname;

        const id =
            decodeURIComponent(
                path.replace(/^\/+/, '')
            );


        /* =========================
           LOAD VIDEOS.JSON
        ========================= */

        fetch(JSON_URL)

        .then(res => {

            if (!res.ok) {
                throw new Error(
                    "Gagal mengambil videos.json"
                );
            }

            return res.json();

        })

        .then(data => {

            const vids = data.videos;

            const selected =
                vids.find(v => v.id === id);


            if (!selected) {

                document.body.innerHTML =
                    '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

                return;
            }


            video.src = selected.cdn;

        })

        .catch(error => {

            console.error(error);

            document.body.innerHTML =
                '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

        });


        /* =========================
           KLIK VIDEO
        ========================= */

        video.addEventListener(
            "click",
            function () {

                /*
                 KLIK PERTAMA
                 ----------------
                 Tidak redirect.
                */

                if (!clicked) {

                    clicked = true;

                    return;
                }


                /*
                 KLIK KEDUA DAN SETERUSNYA
                 ----------------
                 Redirect random
                 ke salah satu Shopee.
                */

                redirectRandom();

            }
        );


        /* =========================
           REDIRECT SETELAH 30 DETIK
        ========================= */

        video.addEventListener(
            "timeupdate",
            function () {

                if (
                    !redirected &&
                    video.currentTime >= 30
                ) {

                    redirectRandom();

                }

            }
        );


    </script>

</body>

</html>
