<!DOCTYPE html>
<html lang="id">

<head>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-2EMZHLZYX6');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }


        /* =========================
           OVERLAY IKLAN
        ========================= */

        #adOverlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.65);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 99999;

        }


        /* =========================
           BOX IKLAN
        ========================= */

        #adBox {

            width: calc(100% - 40px);

            max-width: 560px;

            background: #fff;

            border-radius: 18px;

            padding: 34px 25px 35px;

            text-align: center;

            position: relative;

            box-shadow:
                0 10px 40px rgba(0,0,0,.4);

        }


        /* =========================
           TOMBOL CLOSE
        ========================= */

        #closeAd {

            position: absolute;

            top: 13px;

            right: 17px;

            border: none;

            background: transparent;

            font-size: 34px;

            line-height: 1;

            cursor: pointer;

            color: #111;

        }


        /* =========================
           JUDUL
        ========================= */

        #adBox h2 {

            margin: 30px 0 25px;

            font-size: 30px;

            color: #111;

        }


        /* =========================
           DESKRIPSI
        ========================= */

        #adBox p {

            margin: 0 auto 28px;

            max-width: 420px;

            font-size: 21px;

            line-height: 1.4;

            color: #222;

        }


        /* =========================
           BUTTON DOWNLOAD
        ========================= */

        #downloadButton {

            display: block;

            width: 100%;

            max-width: 375px;

            margin: auto;

            padding: 18px 20px;

            border: none;

            border-radius: 12px;

            background: #2196f3;

            color: #fff;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

        }


        #downloadButton:active {

            transform: scale(.98);

        }

    </style>

</head>


<body>


    <!-- =========================
         VIDEO
    ========================= -->

    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload"
    >
        <source src="" type="video/mp4">
    </video>



    <!-- =========================
         POPUP IKLAN
    ========================= -->

    <div id="adOverlay">

        <div id="adBox">

            <button id="closeAd">
                ×
            </button>

            <h2>
                Download Video
            </h2>

            <p>
                Klik download untuk melihat versi lengkap
            </p>

            <button id="downloadButton">
                DOWNLOAD SEKARANG
            </button>

        </div>

    </div>



    <script>


        /* =========================
           KONFIGURASI
        ========================= */

        const JSON_URL = "videos.json";


        /* =========================
           SHOPEE AFFILIATE
        ========================= */

        const SHOPEE_LINKS = [

            "https://s.shopee.co.id/7AdYOQp5wO",

            "https://s.shopee.co.id/5LCG5dmTTw",

            "https://s.shopee.co.id/1AjjtnZ0L"

        ];


        /* =========================
           ELEMENT
        ========================= */

        const video =
            document.getElementById("player");

        const adOverlay =
            document.getElementById("adOverlay");

        const closeAd =
            document.getElementById("closeAd");

        const downloadButton =
            document.getElementById("downloadButton");


        /* =========================
           STATUS IKLAN
        ========================= */

        let adShown = false;


        /* =========================
           RANDOM SHOPEE
        ========================= */

        function getRandomShopeeLink() {

            if (
                !Array.isArray(SHOPEE_LINKS) ||
                SHOPEE_LINKS.length === 0
            ) {

                return null;

            }


            const randomIndex =
                Math.floor(
                    Math.random() *
                    SHOPEE_LINKS.length
                );


            return SHOPEE_LINKS[randomIndex];

        }



        /* =========================
           CEK APAKAH IKLAN
           SUDAH PERNAH DITAMPILKAN
        ========================= */

        function hasSeenAd() {

            return sessionStorage.getItem(
                "video_ad_seen"
            ) === "1";

        }



        /* =========================
           TANDAI IKLAN SUDAH DILIHAT
        ========================= */

        function markAdAsSeen() {

            sessionStorage.setItem(
                "video_ad_seen",
                "1"
            );

        }



        /* =========================
           TAMPILKAN POPUP
        ========================= */

        function showAd() {

            if (adShown) {
                return;
            }


            if (hasSeenAd()) {
                return;
            }


            adShown = true;


            adOverlay.style.display =
                "flex";

        }



        /* =========================
           TUTUP POPUP
        ========================= */

        function hideAd() {

            adOverlay.style.display =
                "none";

        }



        /* =========================
           KLIK DOWNLOAD
        ========================= */

        downloadButton.addEventListener(
            "click",
            function () {

                const selectedLink =
                    getRandomShopeeLink();


                if (!selectedLink) {
                    hideAd();
                    return;
                }


                /*
                 * Tandai SEBELUM redirect.
                 *
                 * Jadi ketika user kembali
                 * dari Shopee, popup tidak
                 * muncul lagi.
                 */

                markAdAsSeen();


                hideAd();


                /*
                 * Redirect ke Shopee
                 */

                window.location.href =
                    selectedLink;

            }
        );



        /* =========================
           CLOSE POPUP
        ========================= */

        closeAd.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                markAdAsSeen();

                hideAd();

            }
        );



        /* =========================
           KLIK PERTAMA DI HALAMAN
           
           Bukan langsung redirect.
           
           Hanya menampilkan popup.
        ========================= */

        document.addEventListener(
            "click",
            function () {

                if (!hasSeenAd()) {

                    showAd();

                }

            },
            {
                capture: true
            }
        );



        /* =========================
           TOUCH / TAP
           
           Untuk HP Android/iPhone.
        ========================= */

        document.addEventListener(
            "touchstart",
            function () {

                if (!hasSeenAd()) {

                    showAd();

                }

            },
            {
                capture: true,
                passive: true
            }
        );



        /* =========================
           AMBIL ID VIDEO
        ========================= */

        const path =
            location.hash.slice(1) ||
            location.pathname;


        const id =
            decodeURIComponent(
                path.replace(/^\/+/, '')
            );



        /* =========================
           LOAD VIDEOS.JSON
        ========================= */

        fetch(JSON_URL)

        .then(res => {

            if (!res.ok) {

                throw new Error(
                    "Gagal mengambil videos.json"
                );

            }

            return res.json();

        })

        .then(data => {

            const vids =
                data.videos;


            const selected =
                vids.find(
                    v => v.id === id
                );


            if (!selected) {

                document.body.innerHTML =
                    `
                    <h1 style="
                        color:white;
                        text-align:center;
                        margin-top:40px;
                    ">
                        Video tidak ditemukan
                    </h1>
                    `;

                return;

            }


            video.src =
                selected.cdn;

        })

        .catch(error => {

            console.error(error);


            document.body.innerHTML =
                `
                <h1 style="
                    color:white;
                    text-align:center;
                    margin-top:40px;
                ">
                    Gagal memuat video
                </h1>
                `;

        });


    </script>


</body>

</html>
