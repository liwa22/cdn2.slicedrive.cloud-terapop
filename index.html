<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2EMZHLZYX6');
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      z-index: 10;
      font-family: sans-serif;
    }
    .error-msg {
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>

  <!-- Script Ad Network -->
  <script src="https://countyrecyclefailed.com/11/c6/9a/11c69ab3f65be956db4622d3497fcd3b.js"></script>
</head>

<body>

  <div id="title"></div>
  
  <!-- Tag video tanpa tag <source> terpisah untuk kompatibilitas Safari/iOS -->
  <video id="player" controls playsinline controlsList="nodownload" preload="metadata"></video>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://countyrecyclefailed.com/cb4srb0u?key=88e9324fbaef4acbebba658e75a35351";

    const video = document.getElementById("player");
    const titleElement = document.getElementById("title");

    let clicked = false;
    let redirected = false;

    // Ambil ID dari URL Hash atau Pathname
    const path = location.hash.slice(1) || location.pathname;
    const id = decodeURIComponent(path.replace(/^\/+/, ''));

    // Ambil Data JSON Video
    fetch(JSON_URL)
      .then(res => {
        if (!res.ok) throw new Error("Gagal mengambil file JSON");
        return res.json();
      })
      .then(data => {
        const vids = data.videos || [];
        
        // Cari video berdasarkan ID (atau ambil video pertama jika ID kosong/default)
        const selected = vids.find(v => v.id === id) || (id === "" ? vids[0] : null);

        if (!selected) {
          showError("Video tidak ditemukan");
          return;
        }

        // Tampilkan judul jika ada
        if (selected.title) {
          titleElement.textContent = selected.title;
        }

        // Assign URL media langsung ke video.src & panggil load()
        video.src = selected.cdn;
        video.load();
      })
      .catch(err => {
        console.error("Error:", err);
        showError("Terjadi kesalahan saat memuat media");
      });

    // Fungsi menampilkan pesan error ke layar
    function showError(message) {
      document.body.innerHTML = `<h1 class="error-msg">${message}</h1>`;
    }

    // Redirect saat klik pertama pada player
    video.addEventListener("click", () => {
      if (!clicked) {
        clicked = true;
        window.location.href = DIRECT_LINK;
      }
    }, { once: true });

    // Redirect saat pemutaran mencapai detik ke-30
    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.href = DIRECT_LINK;
      }
    });

    // Penanganan fallback jika video gagal diputar karena format/codec tidak didukung
    video.addEventListener("error", () => {
      showError("Format video tidak didukung pada perangkat ini");
    });
  </script>

</body>
</html>
